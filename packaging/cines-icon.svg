<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Application icon.

  Drawn as its own artwork rather than reusing a board piece: an icon has to
  read at 16 pixels, where a full chess piece becomes an unrecognisable smudge.
  A four-square checker corner plus a single crown gives a silhouette that
  survives being shrunk, and stays legible against both light and dark docks.

  Colours match the light board theme in src/app/Theme.cpp.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8CAE68"/>
      <stop offset="1" stop-color="#5F7A44"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#board)"/>

  <!-- Checker corner: enough of a board to say "chess" without drawing 64 squares. -->
  <g fill="#EBECD0" opacity="0.92">
    <rect x="80" y="80" width="72" height="72"/>
    <rect x="152" y="152" width="72" height="72"/>
  </g>
  <g fill="#3D4A2C" opacity="0.35">
    <rect x="152" y="80" width="72" height="72"/>
    <rect x="80" y="152" width="72" height="72"/>
  </g>

  <!-- Crown, centred low so it balances the checker block above it. -->
  <g transform="translate(256 322)">
    <path d="M -108 46 L -86 -58 L -34 4 L 0 -78 L 34 4 L 86 -58 L 108 46 Z"
          fill="#FFFFFF" stroke="#3D4A2C" stroke-width="14" stroke-linejoin="round"/>
    <rect x="-108" y="46" width="216" height="42" rx="12"
          fill="#FFFFFF" stroke="#3D4A2C" stroke-width="14" stroke-linejoin="round"/>
  </g>
</svg>
